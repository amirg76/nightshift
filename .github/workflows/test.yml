name: test
# Private-repo Actions minutes are metered: Linux x1, Windows x2, macOS x10.
# Every push runs Linux only. The full OS matrix runs on demand (Actions tab → Run workflow)
# and on version tags. Docs-only changes do not run anything.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md', 'LICENSE']
  pull_request:
    paths-ignore: ['**/*.md', 'LICENSE']
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the full OS matrix (Linux, macOS, Windows)'
        type: boolean
        default: true
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # (full?) && '[3 OSes]' || '[linux]'. The parentheses matter: && binds tighter than ||, and without
        # them a manual run evaluates to the boolean true instead of a list.
        os: ${{ fromJSON(((github.event_name == 'workflow_dispatch' && inputs.full) || startsWith(github.ref, 'refs/tags/v')) && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: npm test
