name: test
# Full matrix on every push and pull request (Actions minutes are free for public repositories), plus a
# weekly run so a change in Node, the runners or the actions shows up here before it shows up for a user.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md', 'LICENSE', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'LICENSE', 'docs/**']
  schedule:
    - cron: '17 5 * * 1'   # Mondays 05:17 UTC
  workflow_dispatch:
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22', 'lts/*']   # the two supported majors, and whatever LTS is newest today
    runs-on: ${{ matrix.os }}
    # Commit identity for the temp repos the tests create. Set through the environment, never with
    # `git config --global`: a global config step is a template someone will copy onto a real machine.
    env:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.com
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.com
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version && npm test
